<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0b1120" />
    <title>Page not found (404) — Typinger</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1120;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(720px, calc(100% - 2rem)); padding: 3rem 0; }
      .brand { color: #22d3ee; font-size: .8rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      .code { margin-top: 1.5rem; color: #22d3ee; font-size: 3.5rem; font-weight: 800; letter-spacing: .08em; }
      h1 { margin: .5rem 0 0; font-size: clamp(1.9rem, 5vw, 2.8rem); line-height: 1.1; }
      p { max-width: 36rem; color: #94a3b8; line-height: 1.65; }
      ul { display: grid; gap: .65rem; padding: 0; margin: 2rem 0 0; list-style: none; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      a { display: block; padding: .95rem 1rem; border: 1px solid #1e293b; border-radius: .8rem; color: #e2e8f0; text-decoration: none; }
      a:hover, a:focus-visible { border-color: #22d3ee; color: #22d3ee; }
      .home { display: inline-block; margin-top: 1.5rem; border-color: #22d3ee; background: #22d3ee; color: #0b1120; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Typinger</div>
      <div class="code">404</div>
      <h1>That page took a wrong turn</h1>
      <p>The link is broken or the page has moved. Everything you came for is one click away.</p>
      <ul>
        <li><a href="/typing-test/">Typing speed test</a></li>
        <li><a href="/typing-test/1-minute/">1 minute typing test</a></li>
        <li><a href="/typing-practice/">Typing practice</a></li>
        <li><a href="/typing-lessons/">Touch typing lessons</a></li>
        <li><a href="/games/">Typing games</a></li>
        <li><a href="/blog/">Typing guides</a></li>
      </ul>
      <a class="home" href="/">Back to the typing test</a>
    </main>
  </body>
</html>
