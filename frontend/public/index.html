        <script>
            (function () {
                var l = window.location;
                if (l.hostname !== "localhost" && l.hostname !== "127.0.0.1") {
                    if (l.protocol === "http:") { l.replace("https://" + l.host + l.pathname + l.search + l.hash); return; }
                    if (l.hostname.indexOf("www.") === 0) { l.replace("https://" + l.hostname.slice(4) + l.pathname + l.search + l.hash); return; }
                }
                if (l.pathname.length > 1 && l.pathname.slice(-1) !== "/" && !l.pathname.includes(".") && !l.pathname.startsWith("/api") && !l.pathname.startsWith("/admin") && l.pathname !== "/404") {
                    window.history.replaceState(null, "", l.pathname + "/" + l.search + l.hash);
                }
            })();
        </script>
